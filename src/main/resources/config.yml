# TradesRebalance Configuration v1.0.1
# Replicates Minecraft 23w31a trade changes + Extended features
# Created By oumaimaa & Original Idea of Agus5534

# ===========================================
# FEATURE TOGGLES
# ===========================================

# Librarian: Biome-specific enchanted book trades
enable-librarian-nerf: true

# Wandering Trader: Dye trades and price adjustments
enable-wandering-trader-update: true

# Cartographer: Map price adjustments and banner patterns
enable-cartographer-update: true

# Armorer: Diamond armor progression and chainmail rebalance
enable-armorer-update: true

# Toolsmith: Enchanted diamond tools and netherite upgrades
enable-toolsmith-update: true

# Weaponsmith: Enhanced weapons with enchantments
enable-weaponsmith-update: true

# Loot Tables: Enhanced chest loot in structures
enable-loot-table-update: true

# ===========================================
# WANDERING TRADER SETTINGS
# ===========================================
wandering-trader:
  # Number of dye trades to add (1-16)
  new-trades-count: 2

  # Make common items cheaper
  adjust-common-prices: true

  # Make rare items more expensive
  adjust-rare-prices: true

# ===========================================
# LIBRARIAN SETTINGS
# ===========================================
librarian:
  # Biome-specific enchanted books
  # Each biome has specific enchantments that librarians can offer
  biome-enchantments:
    desert:
      - FIRE_PROTECTION
      - THORNS
      - INFINITY
    jungle:
      - FEATHER_FALLING
      - PROJECTILE_PROTECTION
      - UNBREAKING
    plains:
      - PROTECTION
      - PUNCH
      - SMITE
    savanna:
      - SHARPNESS
      - KNOCKBACK
      - BINDING_CURSE
    snowy:
      - AQUA_AFFINITY
      - LOOTING
      - FROST_WALKER
    swamp:
      - DEPTH_STRIDER
      - RESPIRATION
      - MENDING
    taiga:
      - BLAST_PROTECTION
      - FIRE_ASPECT
      - FLAME

# ===========================================
# CARTOGRAPHER SETTINGS
# ===========================================
cartographer:
  # Adjust map prices based on rarity
  adjust-map-prices: true

  # Add banner pattern trades
  add-banner-patterns: true

# ===========================================
# ARMORER SETTINGS
# ===========================================
armorer:
  # Diamond armor availability by:
  # Level 3: Leggings and Boots
  # Level 4: Helmet and Chestplate
  # Level 5: All pieces
  progressive-diamond-armor: true

  # Make chainmail more accessible and cheaper
  improved-chainmail-trades: true

  # Add armor trim template trades for masters
  add-armor-trims: true

# ===========================================
# TOOLSMITH SETTINGS
# ===========================================
toolsmith:
  # Chance to add enchantments to diamond tools (0.0-1.0)
  enchant-diamond-tools-chance: 0.6

  # Add netherite upgrade template trades
  add-netherite-upgrades: true

# ===========================================
# WEAPONSMITH SETTINGS
# ===========================================
weaponsmith:
  # Chance to add enchantments to weapons (0.0-1.0)
  enchant-weapons-chance: 0.7

  # Add mace trades (1.21+ feature)
  add-mace-trades: true

  # Add bell trades
  add-bell-trades: true

# ===========================================
# LOOT TABLE ENHANCEMENTS
# ===========================================
loot-tables:
  # Enhanced structures (better loot, higher chances)
  enhanced-structures:
    - ANCIENT_CITY        # Echo shards, Swift Sneak
    - BASTION_TREASURE    # Netherite, Soul Speed
    - BURIED_TREASURE     # Heart of the Sea, Mending
    - DESERT_PYRAMID      # Fire Protection, Thorns
    - END_CITY_TREASURE   # Elytra, Mending
    - JUNGLE_TEMPLE       # Feather Falling
    - NETHER_BRIDGE       # Fire Aspect
    - SHIPWRECK_TREASURE  # Depth Strider, Respiration
    - STRONGHOLD_LIBRARY  # Better enchanted books
    - UNDERWATER_RUIN_BIG # Golden apples
    - WOODLAND_MANSION    # Totems, diamonds
    - TRIAL_CHAMBERS      # Heavy Core, new enchantments

  # Bonus item chance increase (0.0-1.0)
  # 0.15 = 15% increased chance for rare items
  bonus-chance-multiplier: 0.15

# ===========================================
# DEBUG SETTINGS
# ===========================================

# Enable detailed console logging
debug: false

# Log every trade modification (WARNING: Very verbose!)
debug-trade-modifications: false

# Log loot table generation
debug-loot-generation: false